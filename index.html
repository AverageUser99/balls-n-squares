<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Balls n Squares</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
      user-select: none;
    }
    .shortcuts {
      position: fixed;
      right: 12px;
      bottom: 12px;
      display: flex;
      gap: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font:
        12px/1.4 system-ui,
        sans-serif;
      pointer-events: none;
    }
    .shortcuts kbd {
      padding: 1px 4px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 3px;
      font: inherit;
    }
    .quality {
      position: fixed;
      top: 12px;
      right: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      font:
        12px/1.5 system-ui,
        sans-serif;
      display: grid;
      grid-template-columns: auto minmax(50px, 100px) 1ch;
      align-items: center;
      gap: 4px 8px;
    }
    .quality input {
      width: 100%;
    }
  </style>
  <canvas></canvas>
  <aside class="quality" aria-label="Render settings">
    <label for="bounces">Light bounces</label>
    <input id="bounces" type="range" min="0" max="8" step="1" value="4" />
    <output for="bounces">4</output>
    <label for="cycles">Refinement steps</label>
    <input id="cycles" type="range" min="0" max="8" step="1" value="2" />
    <output for="cycles">2</output>
  </aside>
  <aside class="shortcuts" aria-label="Keyboard shortcuts">
    <span><kbd>M</kbd> Mute</span>
    <span><kbd>C</kbd> Camera</span>
    <span><kbd>R</kbd> Reset</span>
  </aside>
  <script type="module" src="app.js"></script>
</html>
